spring.application.name=Zepto-OrderService
server.port=9090

# =========================
# DataSource Configuration
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/zepto_orders?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

# Explicitly satisfy Hibernate 7 metadata requirements
jakarta.persistence.jdbc.url=jdbc:mysql://${DB_HOST:localhost}:3306/zepto_orders?createDatabaseIfNotExist=true
jakarta.persistence.jdbc.user=root
jakarta.persistence.jdbc.password=12345678
jakarta.persistence.jdbc.driver=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate Configuration
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Kafka Configuration
# =========================
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer