services:
  order-service:
    build: .
    ports: 
      - "8082:8082"
    networks: 
      - micro-net
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/zepto_orders?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12345678

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: zepto_orders
    ports: 
      - "3306:3306"
    networks: 
      - micro-net

networks:
  micro-net:
    driver: bridge
